<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>H1 标签检查工具 · SpeedRank - SEO 诊断工具</title>
  <!-- 地理位置优化 -->
  <meta name="geo.region" content="CN" />
  <meta name="geo.placename" content="China" />
  <meta name="language" content="zh-CN" />
  <link rel="alternate" hreflang="zh-CN" href="https://jichangspeed.com/" />
  <link rel="alternate" hreflang="zh-Hans" href="https://jichangspeed.com/" />

  <!-- 性能优化 -->
  <link rel="dns-prefetch" href="//jichangspeed.com">
  <link rel="preconnect" href="https://jichangspeed.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- 移动端优化 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpeedRank">
  <meta name="theme-color" content="#0f172a">

  <meta name="description" content="H1 标签检查工具 - 用于检测页面 H1 标签数量和内容">
  <meta name="keywords" content="H1检查,SEO工具,标签检测">
  <link rel="canonical" href="https://jichangspeed.com/check_h1.html">
</head>
<body>
  <h1>正在检查 jichangspeed.com 首页的 H1 标签...</h1>
  <div id="result"></div>
  <script>
    fetch('http://localhost:8000/index.html')
      .then(r => r.text())
      .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const h1s = doc.querySelectorAll('h1');
        
        const result = document.getElementById('result');
        result.innerHTML = `
          <h2>找到 ${h1s.length} 个 H1 标签：</h2>
          <ol>
            ${Array.from(h1s).map((h1, i) => `
              <li>
                <strong>H1 #${i+1}:</strong> ${h1.textContent}<br>
                <code>class="${h1.className}"</code><br>
                <code>style="${h1.getAttribute('style') || 'none'}"</code>
              </li>
            `).join('')}
          </ol>
        `;
      });
  </script>
</body>
</html>
