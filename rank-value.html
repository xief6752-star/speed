    if (score >= 85) return '';

    return `

          </div>
          <div class="score-bar-wrap">
            <div class="score-label-row"><span>性价比得分</span><span>${a.scoreVal}/100</span></div>
            <div class="score-bar"><div class="score-fill ${getFillClass(a.scoreVal)}" style="width:${a.scoreVal}%"></div></div>
          </div>
          <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;line-height:1.6;">${a.desc}</div>
          <div class="rank-tags">
            ${a.tags.map(t => `<span class="rtag">${t}</span>`).join('')}

          </div>

            ${a.link !== '#' ? `<a href="${a.link}" target="_blank" rel="noopener" class="rank-btn-main">立即注册</a>` : `<span class="rank-btn-main" style="opacity:.6;cursor:default;">前往官网</span>`}
